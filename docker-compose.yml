services:
  kvrocks:
    image: apache/kvrocks:2.11.0
    container_name: kvrocks-bench
    command: ["--bind", "0.0.0.0"]
    ports:
      - "6666:6666"
      - "6667:6667"
    volumes:
      - kvrocks-data:/var/lib/kvrocks
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "-p", "6666", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.1
    container_name: kvrocks-bench-otel-collector
    profiles: ["otel-stack"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./deployments/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: kvrocks-bench-prometheus
    profiles: ["otel-stack"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    volumes:
      - ./deployments/otel/prometheus.yaml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.1.3
    container_name: kvrocks-bench-grafana
    profiles: ["otel-stack"]
    ports:
      - "3300:3000"
    depends_on:
      - prometheus
    volumes:
      - ./deployments/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deployments/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deployments/grafana/dashboards:/etc/grafana/provisioning/dashboards-json:ro

  runner:
    image: golang:1.24
    container_name: kvrocks-bench-runner
    profiles: ["runner"]
    working_dir: /workspace
    command: ["sleep", "infinity"]
    depends_on:
      kvrocks:
        condition: service_healthy
    volumes:
      - ./:/workspace

volumes:
  kvrocks-data:
